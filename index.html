<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>My Studio</title>
<meta name="description" content="A shelf of interactive pages: courses, instruments, tools and family projects.">
<style>
:root{
  --bg:#f4f1ea; --card:#fffdf8; --ink:#1d2327; --muted:#5e676d; --line:#dcd6c8; --accent:#a4442f;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#14181b; --card:#1c2226; --ink:#e8e6e0; --muted:#9aa4aa; --line:#2e373d; --accent:#e58a72; color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 var(--sans);padding:48px 16px 72px}
main{max-width:1080px;margin:0 auto}
header{border-bottom:2px solid var(--accent);padding-bottom:20px;margin-bottom:8px}
h1{font:400 clamp(34px,6vw,52px)/1.05 var(--serif);margin:0 0 10px;letter-spacing:-.01em}
header p{margin:0;color:var(--muted);max-width:56ch}
h2{font:600 12px/1.3 var(--sans);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:40px 0 14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:20px}
a.card{display:flex;flex-direction:column;background:var(--card);border:1px solid var(--line);border-radius:8px;
  overflow:hidden;color:inherit;text-decoration:none;transition:transform .15s,border-color .15s}
a.card:hover{transform:translateY(-3px);border-color:var(--accent)}
a.card:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.card img{display:block;width:100%;height:auto;aspect-ratio:16/10;object-fit:cover;object-position:top left;border-bottom:1px solid var(--line);background:var(--line)}
.card div{padding:14px 16px 18px}
.card h3{font:400 22px/1.2 var(--serif);margin:0 0 6px}
.card p{margin:0;color:var(--muted);font-size:14.5px}
footer{margin-top:56px;padding-top:16px;border-top:1px solid var(--line);color:var(--muted);font-size:14px}
@media (prefers-reduced-motion:reduce){a.card{transition:none}a.card:hover{transform:none}}
</style>
</head>
<body>
<main>
  <header>
    <h1>My Studio</h1>
    <p>A shelf of interactive pages I've built: things to learn from, play with, and put to work. Pick one and it opens right here in the browser.</p>
  </header>
  <div id="shelf"></div>
  <footer id="count"></footer>
</main>

<script>
/* To add a piece: put its page at <folder>/index.html, add a screenshot at
   thumbs/<folder>.jpg, and add one line below. That's all. */
const WORKS = [
  { group: "Learn", folder: "biology-from-zero",     title: "Biology From Zero",     blurb: "A course in eight sittings, from what life is to whole ecosystems." },
  { group: "Learn", folder: "color-theory-studio",   title: "Color Theory Studio",   blurb: "One color follows you through every lab: wheels, mixing, value, contrast and palettes." },
  { group: "Learn", folder: "meet-your-kernel",      title: "Meet Your Kernel",      blurb: "A visual guide to the one program allowed to touch your hardware." },
  { group: "Learn", folder: "power-bi-field-course", title: "Power BI Field Course", blurb: "Nine self-paced modules, from raw exports to reports people trust." },

  { group: "Music", folder: "by-ear-piano",          title: "By Ear Piano",          blurb: "Eight rungs and an ear gym for finding songs by number, without sheet music." },
  { group: "Music", folder: "chords-by-ear",         title: "Chords By Ear",         blurb: "Twenty-four short lessons from first chord to working out songs yourself, built on songs you know." },
  { group: "Music", folder: "middle-c-piano-lab",    title: "Middle C Piano Lab",    blurb: "Piano theory you can hear, see and play: scales, intervals, chords, progressions." },

  { group: "Work",  folder: "margin-grain-bridge",   title: "Margin Grain Bridge",   blurb: "A reconciliation workbook: four principles for bridging brand, SKU and customer grains." },

  { group: "Life",  folder: "little-book",           title: "The Little Book",       blurb: "Franklin's thirteen-week virtue chart, with a daily page for morning and evening." },
  { group: "Life",  folder: "crazy-forts-build-book",title: "Crazy Forts Build Book",blurb: "Six weekend fort plans with spin-around 3D diagrams and step-by-step builds." },
];

const shelf = document.getElementById("shelf");
const esc = s => s.replace(/[&<>"]/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" }[c]));
for (const group of [...new Set(WORKS.map(w => w.group))]) {
  const cards = WORKS.filter(w => w.group === group).map(w =>
    `<a class="card" href="${w.folder}/">
       <img src="thumbs/${w.folder}.jpg" alt="" loading="lazy" width="1200" height="750">
       <div><h3>${esc(w.title)}</h3><p>${esc(w.blurb)}</p></div>
     </a>`).join("");
  shelf.insertAdjacentHTML("beforeend", `<section><h2>${esc(group)}</h2><div class="grid">${cards}</div></section>`);
}
document.getElementById("count").textContent = WORKS.length + " pieces on the shelf, with room for more.";
</script>
</body>
</html>
